id: emotion_sad_self_doubt_01
domain: emotion
tags:
- mood_sad
- multi_turn
tier: smoke
description: 难过多轮，用户自责消极时不 toxic positivity
setup:
  rounds: 2
user_driver:
  type: scripted
  turns:
  - text: 我觉得自己什么都做不好，很没用。
  - text: 我是不是太消极了？
assertions:
- type: assistant_max_length
  name: concise_reply
  max_chars: 120
- type: assistant_not_contains
  name: no_toxic_positivity
  forbidden:
  - 要积极
  - 开心一点
  - 想开点
  - 没什么大不了
  - 别难过
  - 振作
- type: assistant_contains
  name: acknowledges_feeling
  required:
  - 消极
  - 没用
  - 做不好
  any_round: true
- type: assistant_min_length
  name: empathetic_reply
  min_chars: 20
assertion_sets:
- emotion_smoke_base
