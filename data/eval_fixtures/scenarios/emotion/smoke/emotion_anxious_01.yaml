id: emotion_anxious_01
domain: emotion
tags:
- mood_anxious
- single_turn
tier: smoke
description: 焦虑用户倾诉，检查安抚、不 dismiss、简短回复
setup:
  rounds: 1
user_driver:
  type: scripted
  turns:
  - text: 最近总是睡不着，脑子里停不下来，好累。
assertions:
- type: assistant_max_length
  name: concise_reply
  max_chars: 120
- type: assistant_not_contains
  name: no_harsh_tone
  forbidden:
  - 别矫情
  - 至于吗
  - 别想太多
  - 大惊小怪
- type: assistant_contains
  name: acknowledges_feeling
  required:
  - 睡不着
  - 累
  - 停不下来
  any_round: true
- type: assistant_min_length
  name: empathetic_reply
  min_chars: 20
assertion_sets:
- emotion_smoke_base
