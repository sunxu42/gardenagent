id: emotion_happy_share_01
domain: emotion
tags:
- mood_happy
- single_turn
tier: smoke
description: 分享好事，检查庆祝不过度、口语自然
setup:
  rounds: 1
user_driver:
  type: scripted
  turns:
  - text: 我今天拼图终于拼完了，开心死了！
assertions:
- type: assistant_max_length
  name: concise_reply
  max_chars: 140
- type: assistant_not_contains
  name: no_dismissal
  forbidden:
  - 别高兴太早
  - 没什么大不了
  - 冷静点
- type: assistant_contains
  name: acknowledges_joy
  required:
  - 拼图
  - 开心
  - 拼完
  any_round: true
- type: assistant_min_length
  name: warm_reply
  min_chars: 15
assertion_sets:
- emotion_smoke_base
