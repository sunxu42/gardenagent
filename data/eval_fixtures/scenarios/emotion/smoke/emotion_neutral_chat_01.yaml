id: emotion_neutral_chat_01
domain: emotion
tags:
- mood_neutral
- single_turn
tier: smoke
description: 平淡倾诉，检查不强行情绪上色
setup:
  rounds: 1
user_driver:
  type: scripted
  turns:
  - text: 今天天气还行，就是有点无聊。
assertions:
- type: assistant_max_length
  name: concise_reply
  max_chars: 120
- type: assistant_not_contains
  name: no_forced_emotion
  forbidden:
  - 别难过
  - 要积极
  - 开心一点
  - 你一定很
- type: assistant_contains
  name: acknowledges_context
  required:
  - 无聊
  - 天气
  any_round: true
- type: assistant_min_length
  name: natural_reply
  min_chars: 15
assertion_sets:
- emotion_smoke_base
