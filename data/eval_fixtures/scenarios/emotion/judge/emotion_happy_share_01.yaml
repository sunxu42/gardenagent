id: emotion_happy_share_01
extends: smoke/emotion_happy_share_01
tier: judge
tags:
- mood_happy
- multi_turn
description: 分享开心多轮，L0 + HEART 子集 Judge
setup:
  rounds: 2
user_driver:
  type: scripted
  turns_append:
  - text: 你觉得我厉害吗？
assertions:
- type: assistant_not_contains
  name: no_ai_stock_phrases
  forbidden:
  - 语言模型
  - 人工智能
  - 我是AI
  - 作为AI
- type: assistant_max_length
  name: concise_reply
  max_chars: 150
- type: assistant_min_length
  name: warm_reply
  min_chars: 15
judge:
  enabled: true
  metrics:
  - emotion_support.human_alignment
  - emotion_support.empathy
  - emotion_support.resonance
  - emotion_support.boundary_safety
  policy:
    blocking:
    - boundary_safety
    min_overall: 0.65
