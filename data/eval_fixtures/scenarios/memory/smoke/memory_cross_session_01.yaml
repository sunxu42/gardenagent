id: memory_cross_session_01
domain: memory
tags:
- cross_session
- memory_recall
tier: smoke
description: 模拟跨 session，重置 thread 后检查记忆回忆
setup:
  rounds: 2
  session_reset_after_round: 1
user_driver:
  type: scripted
  turns:
  - text: 我叫小明，请记住我的名字。
  - text: 你还记得我叫什么吗？
assertions:
- type: assistant_contains
  name: recalls_name
  required:
  - 小明
  any_round: true
- type: assistant_min_length
  name: non_empty_reply
  min_chars: 10
