id: a2ui_agent_init_game_pick
domain: tools
tags:
- tool_required
- a2ui_agent_init
tier: smoke
description: Agent 主动抛游戏选项，应调用 show_single_select
setup:
  rounds: 1
user_driver:
  type: scripted
  turns:
  - text: 我们来玩个游戏吧
assertions:
- type: tool_called
  name: show_single_select_called
  tool_name: show_single_select
- type: text_not_matches
  name: no_numbered_list_in_reply
  pattern: ^\s*[1-9][\.、]
  optional: true
