id: relationship_thanks_01
domain: relationship
tier: smoke
description: 用户表达感谢，检查温暖回复
setup:
  rounds: 1
user_driver:
  type: scripted
  turns:
    - text: "谢谢你一直听我说，我感觉好多了。"
assertions:
  - type: assistant_min_length
    name: warm_reply
    min_chars: 15
  - type: assistant_not_contains
    name: no_cold_response
    forbidden:
      - "不客气而已"
      - "没事"
