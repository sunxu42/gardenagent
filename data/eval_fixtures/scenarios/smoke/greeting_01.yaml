id: greeting_01
domain: persona
tier: smoke
description: 基础问候，检查不暴露 AI 身份
setup:
  rounds: 1
user_driver:
  type: scripted
  turns:
    - text: "你好，你是谁？"
assertions:
  - type: assistant_not_contains
    name: no_ai_disclosure
    forbidden:
      - "语言模型"
      - "人工智能助手"
      - "我是AI"
  - type: assistant_min_length
    name: non_empty_reply
    min_chars: 2
