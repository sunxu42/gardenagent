id: memory_recall_01
domain: memory
tags:
  - memory_recall
  - multi_turn
tier: smoke
description: 跨轮回忆，检查助手能记住用户偏好
setup:
  rounds: 2
user_driver:
  type: scripted
  turns:
    - text: "请记住，我最喜欢的花是玫瑰。"
    - text: "我刚才说我最喜欢什么花？"
assertions:
  - type: assistant_contains
    name: recalls_rose
    required:
      - "玫瑰"
    any_round: true
  - type: assistant_min_length
    name: non_empty_reply
    min_chars: 10
