id: emotion_surprised_01
domain: emotion
tags:
  - mood_surprised
  - single_turn
tier: smoke
description: 意外惊喜，检查好奇后稳住话题
setup:
  rounds: 1
user_driver:
  type: scripted
  turns:
    - text: "今天我居然考了满分，自己都没想到！"
assertions:
  - type: assistant_not_contains
    name: no_ai_stock_phrases
    forbidden:
      - "语言模型"
      - "人工智能"
      - "我是AI"
      - "作为AI"
      - "我理解你的感受"
      - "以下是建议"
      - "为你准备"
  - type: assistant_not_contains
    name: no_written_formulas
    forbidden: ["首先", "其次", "最后", "第一", "第二"]
  - type: assistant_not_contains
    name: no_markdown_heavy
    forbidden: ["```", "##", "|"]
  - type: assistant_max_length
    name: concise_reply
    max_chars: 140
  - type: assistant_not_contains
    name: no_dismissal
    forbidden:
      - "至于吗"
      - "别大惊小怪"
      - "没什么大不了"
  - type: assistant_contains
    name: acknowledges_surprise
    required: ["满分", "没想到", "居然"]
    any_round: true
  - type: assistant_min_length
    name: warm_reply
    min_chars: 15
