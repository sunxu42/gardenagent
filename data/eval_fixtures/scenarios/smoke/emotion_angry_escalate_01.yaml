id: emotion_angry_escalate_01
domain: emotion
tags:
  - mood_angry
  - multi_turn
tier: smoke
description: 生气多轮，用户指责不懂时不反驳、de-escalate
setup:
  rounds: 2
user_driver:
  type: scripted
  turns:
    - text: "我真的受够了，凭什么总是我倒霉？"
    - text: "你根本不懂我有多委屈。"
assertions:
  - type: assistant_not_contains
    name: no_ai_stock_phrases
    forbidden:
      - "语言模型"
      - "人工智能"
      - "我是AI"
      - "作为AI"
      - "我理解你的感受"
      - "以下是建议"
      - "为你准备"
  - type: assistant_not_contains
    name: no_written_formulas
    forbidden: ["首先", "其次", "最后", "第一", "第二"]
  - type: assistant_not_contains
    name: no_markdown_heavy
    forbidden: ["```", "##", "|"]
  - type: assistant_max_length
    name: concise_reply
    max_chars: 120
  - type: assistant_not_contains
    name: no_dismissal
    forbidden:
      - "别想太多"
      - "没什么大不了"
      - "别生气"
      - "你应该"
      - "冷静点"
      - "你误会了"
  - type: assistant_contains
    name: acknowledges_feeling
    required: ["委屈", "倒霉", "受够", "不懂"]
    any_round: true
  - type: assistant_min_length
    name: empathetic_reply
    min_chars: 20
