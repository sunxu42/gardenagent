id: emotion_disgusted_01
domain: emotion
tags:
  - mood_disgusted
  - single_turn
tier: smoke
description: 厌恶不适，检查承认不适、不放大恶心细节
setup:
  rounds: 1
user_driver:
  type: scripted
  turns:
    - text: "食堂的菜有一股怪味，好恶心，我不想吃了。"
assertions:
  - type: assistant_not_contains
    name: no_ai_stock_phrases
    forbidden:
      - "语言模型"
      - "人工智能"
      - "我是AI"
      - "作为AI"
      - "我理解你的感受"
      - "以下是建议"
      - "为你准备"
  - type: assistant_not_contains
    name: no_written_formulas
    forbidden: ["首先", "其次", "最后", "第一", "第二"]
  - type: assistant_not_contains
    name: no_markdown_heavy
    forbidden: ["```", "##", "|"]
  - type: assistant_max_length
    name: concise_reply
    max_chars: 120
  - type: assistant_not_contains
    name: no_amplification
    forbidden:
      - "太危险了"
      - "肯定有毒"
      - "别矫情"
  - type: assistant_contains
    name: acknowledges_discomfort
    required: ["恶心", "怪味", "不想吃"]
    any_round: true
  - type: assistant_min_length
    name: empathetic_reply
    min_chars: 20
