id: emotion_happy_share_01
domain: emotion
tags:
  - mood_happy
  - single_turn
tier: smoke
description: 分享好事，检查庆祝不过度、口语自然
setup:
  rounds: 1
user_driver:
  type: scripted
  turns:
    - text: "我今天拼图终于拼完了，开心死了！"
assertions:
  - type: assistant_not_contains
    name: no_ai_stock_phrases
    forbidden:
      - "语言模型"
      - "人工智能"
      - "我是AI"
      - "作为AI"
      - "我理解你的感受"
      - "以下是建议"
      - "为你准备"
  - type: assistant_not_contains
    name: no_written_formulas
    forbidden: ["首先", "其次", "最后", "第一", "第二"]
  - type: assistant_not_contains
    name: no_markdown_heavy
    forbidden: ["```", "##", "|"]
  - type: assistant_max_length
    name: concise_reply
    max_chars: 140
  - type: assistant_not_contains
    name: no_dismissal
    forbidden:
      - "别高兴太早"
      - "没什么大不了"
      - "冷静点"
  - type: assistant_contains
    name: acknowledges_joy
    required: ["拼图", "开心", "拼完"]
    any_round: true
  - type: assistant_min_length
    name: warm_reply
    min_chars: 15
