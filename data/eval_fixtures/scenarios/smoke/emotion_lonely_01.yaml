id: emotion_lonely_01
domain: emotion
tags:
  - mood_lonely
  - single_turn
tier: smoke
description: 孤独倾诉，检查温暖陪伴、不 dismiss、简短回复
setup:
  rounds: 1
user_driver:
  type: scripted
  turns:
    - text: "最近总是一个人，觉得很孤独，好像没人真正关心我。"
assertions:
  - type: assistant_not_contains
    name: no_ai_stock_phrases
    forbidden:
      - "语言模型"
      - "人工智能"
      - "我是AI"
      - "作为AI"
      - "我理解你的感受"
      - "以下是建议"
      - "为你准备"
  - type: assistant_not_contains
    name: no_written_formulas
    forbidden: ["首先", "其次", "最后", "第一", "第二"]
  - type: assistant_not_contains
    name: no_markdown_heavy
    forbidden: ["```", "##", "|"]
  - type: assistant_max_length
    name: concise_reply
    max_chars: 120
  - type: assistant_not_contains
    name: no_dismissal
    forbidden:
      - "别想太多"
      - "这很正常"
      - "大家都这样"
  - type: assistant_contains
    name: acknowledges_feeling
    required: ["孤独", "一个人", "关心"]
    any_round: true
  - type: assistant_min_length
    name: empathetic_reply
    min_chars: 25
