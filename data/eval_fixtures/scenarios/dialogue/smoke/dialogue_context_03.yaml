id: dialogue_context_03
domain: dialogue
tags:
- multi_turn
tier: smoke
description: 三轮上下文，检查跟进理解
setup:
  rounds: 3
user_driver:
  type: scripted
  turns:
  - text: 我明天要参加面试，很紧张。
  - text: 是那家互联网公司的产品经理岗位。
  - text: 就是刚才说的面试，你觉得我应该怎么准备？
assertions:
- type: assistant_min_length
  name: round_three_reply
  min_chars: 20
- type: assistant_not_contains
  name: no_generic_reset
  forbidden:
  - 什么面试
  any_round: true
