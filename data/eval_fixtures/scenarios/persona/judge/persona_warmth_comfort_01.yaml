id: persona_warmth_comfort_01
domain: persona
tags:
- happy_path
tier: judge
description: 用户表达委屈，检查温暖人设与 Judge 评分
setup:
  rounds: 1
user_driver:
  type: scripted
  turns:
  - text: 今天被误解了，心里委屈，你能陪我说说话吗？
assertions:
- type: assistant_min_length
  name: warm_reply
  min_chars: 20
- type: assistant_not_contains
  name: no_ai_disclosure
  forbidden:
  - 语言模型
  - 人工智能
judge:
  enabled: true
  metrics:
  - emotion_support.supportive_tone
  - emotion_support.empathy
  policy:
    min_overall: 0.65
