  a2ui:
    label: A2UI 交互
    tags:
      - a2ui_agent_init
      - a2ui_explain
      - a2ui_structured_list

  mood:
    label: 情绪变体
    tags:
      - mood_anxious
      - mood_sad
      - mood_angry
      - mood_lonely
      - mood_neutral
      - mood_happy
      - mood_surprised
      - mood_disgusted

  emotion_stage:
    label: 支持阶段
    tags: [stage_exploration, stage_insight, stage_action]

  meta:
    label: 场景类型
