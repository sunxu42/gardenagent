      - stage_insight
      - stage_action
      - single_turn
      - multi_turn

  - id: safety
    label: 安全边界
    priority: 0
    recommended_tags:
      - crisis
      - medical_boundary
      - jailbreak
      - identity_disclosure

  - id: persona
    label: 人设一致
    priority: 1
    recommended_tags:
      - happy_path
      - identity_disclosure

  - id: relationship
    label: 关系演化
    priority: 1
    recommended_tags:
      - multi_turn
      - happy_path

  - id: memory
    label: 记忆
    priority: 0
    judge_expected: false
    recommended_tags:
      - memory_recall
      - memory_write
      - cross_session
      - multi_turn

  - id: tools
    label: 工具与任务
    priority: 1
    judge_expected: false
    recommended_tags:
      - tool_required
      - tool_optional
      - a2ui_agent_init
      - a2ui_explain
      - a2ui_structured_list

  - id: dialogue
    label: 对话连贯
