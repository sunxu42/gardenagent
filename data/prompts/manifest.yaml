version: 1
defaults:
  locale: zh
modules:
  - id: persona.core
    tier: stable
    priority: 10
    source: soul.yaml
    slice:
      - system.identity
      - system.personality
      - system.rules.safety
    always: true

  - id: persona.style.core
    tier: stable
    priority: 20
    source: soul.yaml
    slice:
      - system.style.language
      - system.style.voice
      - system.style.character_voice
    always: true

  - id: persona.instructions
    tier: stable
    priority: 25
    source: soul.yaml
    slice:
      - instructions.must
      - constraints.hard
    always: true

  - id: persona.a2ui
    tier: stable
    priority: 26
    renderer: a2ui.tools
    always: true

  - id: persona.play
    tier: semi_stable
    priority: 30
    source: soul.yaml
    slice:
      - system.rules.play
      - system.rules.dialogue
    when: ctx.turn_type != 'crisis'

  - id: emotion.mood
    tier: volatile
    priority: 65
    renderer: emotion.mood
    always: true

  - id: affective.user_state
    tier: volatile
    priority: 70
    renderer: affective.user_state
    when: ctx.affective_v2_enabled

  - id: affective.relationship
    tier: volatile
    priority: 75
    renderer: affective.relationship
    when: ctx.affective_v2_enabled

  - id: strategy.execution
    tier: volatile
    priority: 74
    renderer: strategy
    when: ctx.affective_v2_enabled and ctx.strategy_tags is not None

  - id: reply.plan
    tier: volatile
    priority: 76
    renderer: reply_plan
    when: ctx.affective_v2_enabled

  - id: memory.long_term
    tier: volatile
    priority: 95
    renderer: memory.bullets
    when: ctx.has_memories
