[project]
name = "GardenAI"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "deepagents>=0.3.5",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "fastmcp",
    "loguru",
    "opuslib_next",
    "numpy",
    "langchain_openai",
    "langchain-mcp-adapters",
    "mem0ai",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["."], include = [
    "src*"
] } }
