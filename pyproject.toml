[project]
name = "agent-for-robot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyzmq==25.1.2",
    "numpy==1.24.3",
    "asyncio-mqtt==0.16.1",
    "python-dotenv==1.0.0",
    "loguru==0.7.2",
    "websockets>=11.0.0",
    "librosa==0.10.1",
    "redis==5.0.1",
    "pydub>=0.25.1",
    "lmdb",
    
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["."], include = [
    "agent_layer*",
    "fairland_brain*",
    "tts_layer*",
    "audio_layer*",
    "src*"
] } }
