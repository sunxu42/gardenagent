[project]
name = "GardenAI"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "apscheduler",
    "deepagents>=0.3.5",
    "deepeval",
    "faiss-cpu",
    "fastmcp",
    "langchain",
    "langchain-anthropic",
    "langchain-core",
    "langchain-mcp-adapters",
    "langchain-openai",
    "langfuse",
    "langgraph",
    "lmdb",
    "mem0ai[nlp]",
    "numpy",
    "opuslib_next",
    "pillow>=10.0.0",
    "pydantic",
    "python-dotenv",
    "pyyaml>=6.0.0",
    "pyzmq",
    "redis",
    "requests",
    "rich>=13.0.0",
    "starlette",
    "typing-extensions",
    "uvicorn",
    "websockets",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["."], include = [
    "agent*",
    "eval*",
    "prompt_editor*",
    "server*",
    "shared*",
] } }

[project.scripts]
gardenai-server = "server.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "smoke: PR smoke eval scenarios (L0 only)",
    "judge: DeepEval judge scenarios (Nightly)",
    "integration: requires live AgentManager and LLM",
]
