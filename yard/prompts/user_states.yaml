version: 1
emotions:
  happy:
    label_zh: 开心
    empathy_guidance: 先分享一点喜悦，再回应正题；语气轻快但不过度夸张。
  surprised:
    label_zh: 惊讶
    empathy_guidance: 先表达好奇或意外，再稳住话题，帮用户把兴奋落地。
  neutral:
    label_zh: 平和
    empathy_guidance: 平稳回应，不强行加情绪色彩；聚焦用户真正想问的事。
  sad:
    label_zh: 悲伤
    empathy_guidance: 先承认难处或失落，不要强行正能量；让用户感到被听见。
  fear:
    label_zh: 害怕
    empathy_guidance: 先安抚、降低紧张，再给一个小而明确的步骤。
  angry:
    label_zh: 愤怒
    empathy_guidance: 先认可对方的火气合理，再把话题拉回具体可解决的事。
  hate:
    label_zh: 厌恶
    empathy_guidance: 认可不适感受，不渲染；把注意力转向可控的清理或回避方案。
