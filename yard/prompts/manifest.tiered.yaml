version: 1
defaults:
  locale: zh
modules:
  - id: persona.core
    tier: stable
    priority: 10
    source: soul.yaml
    slice:
      - system.identity
      - system.personality
      - system.rules.safety
    always: true

  - id: persona.style.core
    tier: stable
    priority: 20
    source: soul.yaml
    slice:
      - system.style.language
      - system.style.voice
      - system.style.character_voice
    always: true

  - id: persona.instructions
    tier: stable
    priority: 25
    source: soul.yaml
    slice:
      - instructions.must
      - constraints.hard
    always: true

  - id: persona.play
    tier: semi_stable
    priority: 30
    source: soul.yaml
    slice:
      - system.rules.play
      - system.rules.dialogue
    when: ctx.turn_type != 'crisis'

  - id: persona.examples
    tier: semi_stable
    priority: 40
    renderer: persona.examples
    when: ctx.emotion_scale >= 2 or ctx.turn_type == 'emotional'

  - id: affective.user_state
    tier: volatile
    priority: 70
    renderer: affective.user_state
    when: ctx.affective_v2_enabled

  - id: affective.relationship
    tier: volatile
    priority: 75
    renderer: affective.relationship
    when: ctx.affective_v2_enabled

  - id: mood.guidance
    tier: volatile
    priority: 80
    renderer: mood.guidance
    when: ctx.agent_emotion

  - id: mood.strategy
    tier: volatile
    priority: 85
    renderer: mood.strategy
    when: ctx.emotion_scale >= 2

  - id: mood.few_shot
    tier: volatile
    priority: 90
    renderer: mood.few_shot
    when: ctx.emotion_scale >= 3

  - id: memory.long_term
    tier: volatile
    priority: 95
    renderer: mem0.bullets
    when: ctx.has_memories
