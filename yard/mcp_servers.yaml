# MCP Server configurations
# These are loaded by yard_manage.py for MultiServerMCPClient
# You can add multiple servers by adding new entries with unique names
# Each server requires:
#   - url: The MCP server endpoint URL
#   - transport: The transport type (e.g., "http", "stdio", "sse")

# garden:
#   url: http://127.0.0.1:8000/mcp
#   transport: http

embenchench:
  url: http://127.0.0.1:8001/mcp
  transport: http
