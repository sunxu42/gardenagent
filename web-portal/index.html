<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小智服务器测试页面</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div class="container">
        <h1>Garden AI</h1>

        <div id="scriptStatus" class="script-status-overlay">
            正在加载Opus库...</div>

        <!-- 添加配置面板 -->
        <div class="section">
            <h2>
                设备配置
                <span class="section-heading-meta">
                    <span>MAC: <strong id="displayMac"></strong></span>
                    <span>客户端: <strong id="displayClient">web_test_client</strong></span>
                </span>
                <button class="toggle-button" id="toggleConfig">编辑</button>
            </h2>
            <div class="config-panel" id="configPanel">
                <div class="control-panel">
                    <div class="field-row field-row--label-fixed">
                        <label for="deviceMac">设备MAC:</label>
                        <input class="input-field input-field--grow" type="text" id="deviceMac" placeholder="设备MAC地址">
                    </div>
                    <div class="field-row field-row--label-fixed">
                        <label for="deviceName">设备名称:</label>
                        <input class="input-field input-field--grow" type="text" id="deviceName" value="Web测试设备" placeholder="设备名称">
                    </div>
                    <div class="field-row field-row--label-fixed">
                        <label for="clientId">客户端ID:</label>
                        <input class="input-field input-field--grow" type="text" id="clientId" value="web_test_client" placeholder="客户端ID">
                    </div>
                    <div class="field-row field-row--label-fixed">
                        <label for="token">认证Token:</label>
                        <input class="input-field input-field--grow" type="text" id="token" value="your-token1" placeholder="认证Token">
                    </div>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>
                连接信息
                <span class="section-heading-meta">
                    <!-- <span>OTA: <span id="otaStatus" class="status">ota未连接</span></span> -->
                    <span>WS: <span id="connectionStatus" class="status">ws未连接</span></span>
                </span>
            </h2>
            <div class="connection-controls">
                <!-- <input type="text" id="otaUrl" value="http://127.0.0.1:8002/xiaozhi/ota/"
                    placeholder="OTA服务器地址，如：http://127.0.0.1:8002/xiaozhi/ota/" /> -->
                <input class="input-field input-field--grow" type="text" id="serverUrl" value="ws://127.0.0.1:8005"
                    placeholder="WebSocket服务器地址，如：ws://127.0.0.1:8005" />
                <button id="connectButton">连接</button>
                <button id="authTestButton">测试认证</button>
            </div>
        </div>

        <div class="section">
            <div class="tabs">
                <button class="tab active" data-tab="text">文本消息</button>
                <button class="tab" data-tab="voice">语音消息</button>
            </div>

            <div class="tab-content active" id="textTab">
                <div class="message-input">
                    <input class="input-field input-field--grow" type="text" id="messageInput" placeholder="输入消息..." disabled>
                    <button id="sendTextButton" disabled>发送</button>
                </div>
            </div>

            <div class="tab-content" id="voiceTab">
                <div class="audio-controls">
                    <button id="recordButton" class="record-button" disabled>开始录音</button>
                    <button id="timingButton" class="timing-button" disabled>开始计时</button>
                    <div id="timingResult" class="timing-result" style="display: none;"></div>
                </div>
                <canvas id="audioVisualizer" class="audio-visualizer panel-bordered"></canvas>
            </div>
        </div>

        <div class="section">
            <h2>会话记录</h2>
            <div class="flex-container">
                <div id="conversation" class="conversation panel-bordered"></div>
                <div id="logContainer">
                    <div class="log-entry log-info">准备就绪，请连接服务器开始测试...</div>
                </div>
            </div>
        </div>

        <div class="section md-workspace-panel">
            <h2>提示词与角色配置（yard/prompts）</h2>
            <p class="md-ws-intro">
                运行时提示词由代码从 <code>yard/prompts</code> 下的 YAML 动态组装。左侧为目录与 <code>.yaml</code> / <code>.yml</code> 文件树，选中后在右侧编辑并保存，会写回仓库中的对应文件（需本机启动 <code>skills-editor-server</code>，默认端口 8010）。
            </p>
            <div class="md-ws-connection field-row">
                <label for="promptsYamlApiBase">提示词编辑服务地址:</label>
                <input class="input-field input-field--grow" type="text" id="promptsYamlApiBase" value="http://127.0.0.1:8010"
                    placeholder="例如：http://127.0.0.1:8010（与 skills-editor-server 一致）" />
            </div>
            <div class="md-ws-toolbar">
                <button type="button" id="promptsYamlRefreshTree">刷新文件列表</button>
            </div>
            <div class="md-ws-layout">
                <div class="md-ws-tree-wrap">
                    <ul class="md-tree-list root" id="promptsYamlTree"></ul>
                </div>
                <div class="md-ws-editor-wrap">
                    <div class="md-ws-editor-header">
                        <div class="md-ws-current-path" id="promptsYamlCurrentPath">未选择文件</div>
                        <div class="md-ws-editor-header-actions">
                            <span id="promptsYamlStatus" aria-live="polite"></span>
                            <button type="button" id="promptsYamlSave" disabled>保存</button>
                        </div>
                    </div>
                    <div class="md-ws-editor-body">
                        <pre class="md-ws-yaml-backdrop" aria-hidden="true"><code id="promptsYamlHighlight"></code></pre>
                        <textarea id="promptsYamlEditor" placeholder="请先在左侧选择一个 YAML 文件…" disabled spellcheck="false"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Opus解码库 -->
    <script src="libopus.js"></script>
    <script src="index.js"></script>
</body>

</html>
